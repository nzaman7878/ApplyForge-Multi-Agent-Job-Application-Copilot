<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none" role="img" aria-label="ApplyForge Multi-Agent Pipeline Visualization">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" rx="20" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#60a5fa" stroke-width="1">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800"/>
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="180" r="140" fill="#2563eb" opacity="0.12" filter="blur(60px)"/>
  <circle cx="600" cy="240" r="160" fill="#0d9488" opacity="0.10" filter="blur(70px)"/>

  <!-- Pipeline Connection Lines -->
  <path d="M220 220 L350 220 L480 220 L620 220" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Card 1: Resume Input -->
  <rect x="70" y="160" width="160" height="120" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="85" y="180" width="36" height="36" rx="8" fill="#1e3a8a"/>
  <text x="103" y="204" fill="#93c5fd" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">📄</text>
  <text x="130" y="195" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="600">Resume Parser</text>
  <text x="130" y="212" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">PDF &amp; DOCX Sections</text>
  <rect x="85" y="240" width="130" height="6" rx="3" fill="#334155"/>
  <rect x="85" y="254" width="90" height="6" rx="3" fill="#334155"/>

  <!-- Card 2: AI Tailoring Agent -->
  <rect x="270" y="140" width="170" height="160" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="285" y="160" width="36" height="36" rx="8" fill="#312e81"/>
  <text x="303" y="184" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✨</text>
  <text x="330" y="175" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="600">Tailoring Agent</text>
  <text x="330" y="192" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">LangGraph Pipeline</text>
  <rect x="285" y="215" width="140" height="24" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="355" y="231" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">✓ Quantified Impact Metrics</text>
  <rect x="285" y="248" width="140" height="24" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="355" y="264" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">✓ Active Verb Transformation</text>

  <!-- Card 3: ATS & Fit Scoring -->
  <rect x="480" y="150" width="160" height="140" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
  <rect x="495" y="170" width="36" height="36" rx="8" fill="#064e3b"/>
  <text x="513" y="194" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🎯</text>
  <text x="540" y="185" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="600">ATS Scorer</text>
  <text x="540" y="202" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">94% Strong Match</text>
  <circle cx="560" cy="245" r="22" stroke="#065f46" stroke-width="4" fill="none"/>
  <circle cx="560" cy="245" r="22" stroke="#10b981" stroke-width="4" stroke-dasharray="138" stroke-dashoffset="15" stroke-linecap="round" fill="none" transform="rotate(-90 560 245)"/>
  <text x="560" y="250" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">94%</text>

  <!-- Top Badge -->
  <rect x="290" y="40" width="220" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="308" cy="56" r="5" fill="#38bdf8"/>
  <text x="400" y="61" fill="#93c5fd" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ApplyForge Autonomous AI Copilot</text>
</svg>
